spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
server.port=8090
server.servlet.context-path=/Medical_SCM

# Allow circular references if any (common in legacy apps)
spring.main.allow-circular-references=true

# Database properties (though the app uses hardcoded JDBC in dbConnect.java)
spring.datasource.url=jdbc:mysql://localhost:3306/medicine_scm?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
